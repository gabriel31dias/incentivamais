<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ranking · Incentiva+</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css?v=25"></head>
<body><div class="app">
<header class="topbar">
  <a href="inicio.html" class="menu" aria-label="Voltar"><i class="fa-solid fa-arrow-left"></i></a>
  <a href="inicio.html" class="brand"><img src="img/logo.png" alt="Incentiva+"><div><b>Incentiva<i>+</i></b><small>Plataforma de Incentivo de Vendas</small></div></a>
  <a href="#" class="bell" aria-label="Notificações"><i class="fa-regular fa-bell"></i><em>3</em></a>
  <a href="#" class="me"></a>
</header>

<section class="page-h">
  <div><h1><i class="fa-solid fa-trophy" style="color:var(--gold)"></i>Ranking</h1><p>Vendedores com mais pontos lançados no mês.</p></div>
  <label class="select sv-month" style="border-color:var(--line)"><i class="fa-regular fa-calendar"></i><select id="month" aria-label="Mês"></select><i class="fa-solid fa-chevron-down"></i></label>
</section>

<div class="tabs" id="scopes" role="tablist">
  <button data-scope="all" class="on">Geral</button><button data-scope="distributor">Minha Distribuidora</button><button data-scope="team">Minha Equipe</button>
</div>

<section class="pod" id="podium" aria-label="Pódio"></section>

<section class="kpis">
  <div class="card"><i class="fa-solid fa-users"></i><b id="k-sellers">—</b>Vendedores pontuaram</div>
  <div class="card"><i class="fa-solid fa-chart-column"></i><b id="k-dists">—</b>Distribuidoras</div>
  <div class="card"><i class="fa-solid fa-trophy" style="color:var(--gold)"></i><b id="k-me">—</b>Sua posição</div>
  <div class="card"><i class="fa-solid fa-medal"></i><b id="k-points">—</b>Pontos distribuídos</div>
</section>

<section class="card rank-box">
  <div class="rtabs"><button class="on"><i class="fa-solid fa-user"></i>Top 50 vendedores</button></div>
  <div id="rank" aria-live="polite"></div>
</section>
</div>

<nav class="nav">
  <a href="inicio.html" class="nav-brand"><img src="img/logo.png" alt=""><b>Incentiva<i>+</i></b></a>
  <a href="inicio.html"><i class="fa-solid fa-house"></i>Início</a>
  <a href="gerente.html"><i class="fa-solid fa-chart-pie"></i>Gerente</a>
  <a href="importar.html"><i class="fa-solid fa-cloud-arrow-up"></i>Importar</a>
  <a href="extrato.html"><i class="fa-regular fa-file-lines"></i>Extrato</a>
  <a href="treinamentos.html"><i class="fa-solid fa-graduation-cap"></i>Treinamentos</a>
  <a href="ranking.html" class="on"><i class="fa-solid fa-trophy"></i>Ranking</a>
  <a href="equipe.html"><i class="fa-solid fa-users"></i>Equipe</a>
  <a href="#"><i class="fa-solid fa-ellipsis"></i>Mais</a>
</nav>

<script>
// Ranking: GET /app/me/ranking?scope=all|distributor|team&month=AAAA-MM
const MES_LONGO = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
const comp = (c) => `${MES_LONGO[+c.slice(5) - 1]}/${c.slice(0, 4)}`;
const num = (n) => (n ?? 0).toLocaleString('pt-BR');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const ini = (n) => esc(n.split(' ').filter(Boolean).map((w) => w[0]).slice(0, 2).join('').toUpperCase());
const $ = (id) => document.getElementById(id);
const HEAD = '<div class="rrow head"><span>#</span><span>Vendedor</span><span class="dist">Distribuidora</span><span>Pontos</span><span class="pct">x mês ant.</span><span class="evo"></span><span></span></div>';
let state = { scope: 'all', month: null };

const row = (r, max) => `
<div class="rrow${r.position === 1 ? ' first' : ''}${r.me ? ' mine' : ''}">
  <span>${r.position <= 3 ? `<span class="medal m${r.position}">${r.position}</span>` : r.position}</span>
  <span class="who"><span class="av av-ini">${ini(r.name)}</span><span>${esc(r.name)}${r.me ? ' <em class="you">você</em>' : ''}<small>${esc(r.teamName ?? '')}</small></span></span>
  <span class="dist">${esc(r.distributorName ?? '—')}</span>
  <span class="sc"><i class="fa-solid fa-star"></i>${num(r.points)}</span>
  <span class="pct ${r.evolution == null ? 'muted' : r.evolution >= 0 ? 'up' : 'red'}" title="Comparado ao mês anterior">${r.evolution == null ? 'novo' : `${r.evolution >= 0 ? '↑' : '↓'} ${num(Math.abs(r.evolution))}%`}</span>
  <span class="evo"><div class="bar"><span style="width:${Math.max(2, (r.points / max) * 100)}%"></span></div></span>
  <span></span>
</div>`;

async function load() {
  $('rank').innerHTML = HEAD + '<div class="sv-empty"><i class="fa-solid fa-spinner fa-spin"></i>Carregando ranking...</div>';
  try {
    const d = await window.incentiva.api(`/app/me/ranking?${new URLSearchParams({ scope: state.scope, ...(state.month ? { month: state.month } : {}) })}`);
    state.month = d.month;
    $('month').innerHTML = d.months.map((m) => `<option value="${m}"${m === d.month ? ' selected' : ''}>${comp(m)}</option>`).join('');
    document.querySelectorAll('#scopes button').forEach((b) => {
      b.hidden = !d.scopes[b.dataset.scope];
      b.classList.toggle('on', b.dataset.scope === d.scope);
      b.setAttribute('aria-selected', b.dataset.scope === d.scope);
    });
    $('k-sellers').textContent = num(d.kpis.sellers);
    $('k-dists').textContent = num(d.kpis.distributors);
    $('k-me').textContent = d.me ? `${num(d.me.position)}º` : '—';
    $('k-points').textContent = num(d.kpis.points);

    // pódio na ordem 2º, 1º, 3º
    $('podium').innerHTML = [1, 0, 2].map((i) => d.top[i]).filter(Boolean).map((r) => `
      <div class="pod-c p${r.position}${r.me ? ' mine' : ''}">
        <span class="crown"><i class="fa-solid fa-crown"></i><em>${r.position}</em></span>
        ${r.position === 1 ? '<i class="fa-solid fa-leaf laurel l"></i><i class="fa-solid fa-leaf laurel r"></i>' : ''}
        <span class="pod-ring"><span class="av av-ini">${ini(r.name)}</span></span>
        <b class="nm">${esc(r.name)}</b><small>${esc(r.distributorName ?? '')}</small>
        <span class="pts"><i class="fa-solid fa-star"></i><span><b>${num(r.points)}</b><small>pontos</small></span></span>
      </div>`).join('');

    const max = d.top[0]?.points || 1;
    const meOut = d.me && !d.top.some((r) => r.me);
    $('rank').innerHTML = HEAD + (d.top.length
      ? d.top.map((r) => row(r, max)).join('') + (meOut ? '<div class="rgap">⋯</div>' + row(d.me, max) : '')
      : '<div class="sv-empty"><i class="fa-solid fa-trophy"></i>Ninguém pontuou neste mês ainda.</div>');
  } catch (e) {
    $('rank').innerHTML = HEAD + `<div class="sv-empty"><i class="fa-solid fa-triangle-exclamation"></i>${esc(e.message)}</div>`;
  }
}

$('scopes').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b || b.dataset.scope === state.scope) return;
  state.scope = b.dataset.scope;
  load();
});
$('month').addEventListener('change', (e) => { state.month = e.target.value; load(); });

if (window.incentiva) load();
else document.addEventListener('incentiva:ready', () => load(), { once: true });
</script>
<script src="session.js?v=19"></script>
</body></html>
